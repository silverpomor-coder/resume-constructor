<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор резюме</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Конструктор резюме</h1>
      <p id="status">Загрузите исходный файл резюме</p>
    </div>
    <div class="actions">
      <button type="button" class="source-button active" data-source="auto">Авто</button>
      <button type="button" class="source-button" data-source="hh">HH</button>
      <label class="button">
        Загрузить
        <input id="fileInput" type="file" accept=".doc,.docx,.rtf,.txt,.odt">
      </label>
      <button id="saveButton" disabled>Сохранить</button>
      <button id="openFolderButton" disabled>Открыть</button>
    </div>
  </header>

  <main class="workspace">
    <section class="pane source-pane">
      <h2>Исходный текст</h2>
      <pre id="sourceText">Файл пока не загружен.</pre>
    </section>
    <div class="resizer" data-left="source" data-right="preview"></div>
    <section class="pane preview-pane">
      <h2>Финальный документ</h2>
      <div id="preview" class="preview">После загрузки здесь появятся распознанные данные.</div>
    </section>
    <div class="resizer" data-left="preview" data-right="editor"></div>
    <section class="pane editor-pane">
      <h2>Редактирование</h2>
      <div class="photo-block">
        <span class="photo-title">Фото кандидата</span>
        <div class="photo-preview">
          <img id="photoPreview" alt="Фото кандидата" hidden>
          <span id="photoPlaceholder">Фото не загружено</span>
        </div>
        <div class="photo-actions">
          <label class="button">
            Загрузить фото
            <input id="photoInput" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
          </label>
          <button id="deletePhotoButton" type="button" disabled>Удалить фото</button>
        </div>
        <div id="photoStatus" class="photo-status">Фото не загружено</div>
      </div>
      <form id="editorForm">
        {% for field in fields %}
        <label class="field">
          <span>{{ field.label }}</span>
          <textarea name="{{ field.key }}" rows="2"></textarea>
        </label>
        {% endfor %}
      </form>
    </section>
  </main>

  <script>
    window.FIELD_DEFS = {{ fields|tojson }};
    window.APP_MODE = {{ app_mode|tojson }};
  </script>
  <script src="/static/app.js"></script>
</body>
</html>

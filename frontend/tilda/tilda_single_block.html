<style>
#resume-constructor-widget {
  width: 100%;
  color: #222222;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
}

#resume-constructor-widget * {
  box-sizing: border-box;
}

#resume-constructor-widget .rc-shell {
  width: 100%;
  min-height: 760px;
  background: #11b2d0;
  border: 1px solid #0f9bb5;
}

#resume-constructor-widget .rc-topbar {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 14px;
  background: #ffffff;
  border-bottom: 1px solid #d0d0d0;
}

#resume-constructor-widget .rc-title {
  margin: 0;
  font-size: 20px;
  line-height: 1.2;
}

#resume-constructor-widget .rc-status {
  margin: 4px 0 0;
  color: #666666;
}

#resume-constructor-widget .rc-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

#resume-constructor-widget .rc-button,
#resume-constructor-widget .rc-file-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid #999999;
  border-radius: 4px;
  background: #ffffff;
  color: #222222;
  cursor: pointer;
  font: inherit;
  text-decoration: none;
}

#resume-constructor-widget .rc-button:disabled {
  color: #999999;
  cursor: default;
}

#resume-constructor-widget .rc-active {
  background: #222222;
  color: #ffffff;
}

#resume-constructor-widget .rc-hidden-input {
  display: none;
}

#resume-constructor-widget .rc-workspace {
  display: grid;
  grid-template-columns: minmax(260px, 40%) minmax(360px, 60%);
  gap: 10px;
  padding: 10px;
}

#resume-constructor-widget .rc-pane {
  min-width: 0;
  height: 660px;
  overflow: auto;
  padding: 0 12px 12px;
  background: #ffffff;
  border: 1px solid #d8d8d8;
}

#resume-constructor-widget .rc-pane-title {
  position: sticky;
  top: 0;
  z-index: 1;
  margin: 0;
  padding: 10px 0;
  background: #ffffff;
  border-bottom: 1px solid #dddddd;
  font-size: 15px;
}

#resume-constructor-widget .rc-source-text {
  margin: 12px 0 0;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.45;
}

#resume-constructor-widget .rc-photo-block,
#resume-constructor-widget .rc-field {
  display: block;
  padding: 10px 0;
  border-bottom: 1px solid #eeeeee;
}

#resume-constructor-widget .rc-photo-title,
#resume-constructor-widget .rc-field span {
  display: block;
  margin-bottom: 6px;
  font-weight: 700;
}

#resume-constructor-widget .rc-photo-preview {
  width: 150px;
  height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
  border: 1px solid #bbbbbb;
  background: #f7f7f7;
  color: #666666;
  text-align: center;
}

#resume-constructor-widget .rc-photo-preview img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

#resume-constructor-widget .rc-photo-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

#resume-constructor-widget .rc-photo-status {
  min-height: 20px;
  margin-top: 6px;
  color: #666666;
}

#resume-constructor-widget textarea {
  width: 100%;
  min-height: 38px;
  resize: vertical;
  padding: 8px;
  border: 1px solid #bbbbbb;
  border-radius: 4px;
  font: inherit;
  line-height: 1.35;
}

@media (max-width: 980px) {
  #resume-constructor-widget .rc-topbar {
    display: block;
  }

  #resume-constructor-widget .rc-actions {
    margin-top: 10px;
  }

  #resume-constructor-widget .rc-workspace {
    display: block;
  }

  #resume-constructor-widget .rc-pane {
    height: 420px;
    margin-bottom: 10px;
  }
}

</style>

<div id="resume-constructor-widget" style="width:100%;color:#222222;font-family:Arial,Helvetica,sans-serif;font-size:14px;">
  <div class="rc-shell" style="width:100%;min-height:760px;background:#11b2d0;border:1px solid #0f9bb5;box-sizing:border-box;">
    <div class="rc-topbar" style="display:flex;justify-content:space-between;gap:16px;padding:12px 14px;background:#ffffff;border-bottom:1px solid #d0d0d0;box-sizing:border-box;">
      <div>
        <h2 class="rc-title" style="margin:0;font-size:20px;line-height:1.2;">Конструктор резюме</h2>
        <p class="rc-status" data-rc-status style="margin:4px 0 0;color:#666666;">Загрузите исходный файл резюме</p>
      </div>
      <div class="rc-actions" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <button type="button" class="rc-button rc-active" data-rc-source="auto" style="display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border:1px solid #999999;border-radius:4px;background:#222222;color:#ffffff;cursor:pointer;font:inherit;text-decoration:none;">Авто</button>
        <button type="button" class="rc-button" data-rc-source="hh" style="display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border:1px solid #999999;border-radius:4px;background:#ffffff;color:#222222;cursor:pointer;font:inherit;text-decoration:none;">HH</button>
        <label class="rc-file-button" style="display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border:1px solid #999999;border-radius:4px;background:#ffffff;color:#222222;cursor:pointer;font:inherit;text-decoration:none;">
          Загрузить
          <input class="rc-hidden-input" data-rc-file type="file" accept=".doc,.docx,.rtf,.txt,.odt" style="display:none;">
        </label>
        <button type="button" class="rc-button" data-rc-save disabled style="display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border:1px solid #999999;border-radius:4px;background:#ffffff;color:#999999;cursor:default;font:inherit;text-decoration:none;">Сохранить DOCX</button>
        <button type="button" class="rc-button" data-rc-health style="display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border:1px solid #999999;border-radius:4px;background:#ffffff;color:#222222;cursor:pointer;font:inherit;text-decoration:none;">Проверить backend</button>
      </div>
    </div>

    <div class="rc-workspace" style="display:grid;grid-template-columns:minmax(260px,40%) minmax(360px,60%);gap:10px;padding:10px;box-sizing:border-box;">
      <section class="rc-pane" style="min-width:0;height:660px;overflow:auto;padding:0 12px 12px;background:#ffffff;border:1px solid #d8d8d8;box-sizing:border-box;">
        <h3 class="rc-pane-title" style="position:sticky;top:0;z-index:1;margin:0;padding:10px 0;background:#ffffff;border-bottom:1px solid #dddddd;font-size:15px;">Исходный текст</h3>
        <pre class="rc-source-text" data-rc-source-text style="margin:12px 0 0;white-space:pre-wrap;word-break:break-word;font-family:Arial,Helvetica,sans-serif;line-height:1.45;">Файл пока не загружен.</pre>
      </section>

      <section class="rc-pane" style="min-width:0;height:660px;overflow:auto;padding:0 12px 12px;background:#ffffff;border:1px solid #d8d8d8;box-sizing:border-box;">
        <h3 class="rc-pane-title" style="position:sticky;top:0;z-index:1;margin:0;padding:10px 0;background:#ffffff;border-bottom:1px solid #dddddd;font-size:15px;">Редактирование</h3>
        <div class="rc-photo-block" style="display:block;padding:10px 0;border-bottom:1px solid #eeeeee;">
          <span class="rc-photo-title" style="display:block;margin-bottom:6px;font-weight:700;">Фото кандидата</span>
          <div class="rc-photo-preview" style="width:150px;height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;border:1px solid #bbbbbb;background:#f7f7f7;color:#666666;text-align:center;">
            <img data-rc-photo-preview alt="Фото кандидата" hidden>
            <span data-rc-photo-placeholder>Фото не загружено</span>
          </div>
          <div class="rc-photo-actions" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <label class="rc-file-button" style="display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border:1px solid #999999;border-radius:4px;background:#ffffff;color:#222222;cursor:pointer;font:inherit;text-decoration:none;">
              Загрузить фото
              <input class="rc-hidden-input" data-rc-photo type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" style="display:none;">
            </label>
            <button type="button" class="rc-button" data-rc-delete-photo disabled style="display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border:1px solid #999999;border-radius:4px;background:#ffffff;color:#999999;cursor:default;font:inherit;text-decoration:none;">Удалить фото</button>
          </div>
          <div class="rc-photo-status" data-rc-photo-status style="min-height:20px;margin-top:6px;color:#666666;">Фото не загружено</div>
        </div>
        <form data-rc-editor></form>
      </section>
    </div>
  </div>
</div>


<script>
(function () {
  const API_BASE_URL = "https://api.service-agency.info";
  const ACCESS_KEY = "";

  const root = document.getElementById("resume-constructor-widget");
  if (!root) return;

  const DEFAULT_FIELDS = [
    { key: "role", label: "Должность / желаемая роль" },
    { key: "salary", label: "Ожидаемый размер оплаты" },
    { key: "fio", label: "ФИО" },
    { key: "citizenship", label: "Гражданство" },
    { key: "birth_place_date", label: "Место и дата рождения" },
    { key: "family", label: "Семейное положение / дети" },
    { key: "registration", label: "Место регистрации" },
    { key: "location", label: "Фактическое местонахождение" },
    { key: "metro", label: "Метро / станция электрички" },
    { key: "criminal_record", label: "Наличие судимости" },
    { key: "languages", label: "Знание иностранных языков" },
    { key: "medical_book", label: "Наличие медицинской книжки" },
    { key: "driving", label: "Водительские права, стаж, собственный автомобиль" },
    { key: "agency_comment", label: "Комментарий Агентства" },
    { key: "education_level", label: "Образование" },
    { key: "education", label: "Учебное заведение, год окончания" },
    { key: "courses", label: "Повышение квалификации, курсы" },
    { key: "recommendations", label: "Наличие рекомендаций" },
  ];

  let fieldDefs = DEFAULT_FIELDS;
  let currentSession = "";
  let currentSource = "auto";

  const fileInput = root.querySelector("[data-rc-file]");
  const sourceButtons = root.querySelectorAll("[data-rc-source]");
  const saveButton = root.querySelector("[data-rc-save]");
  const healthButton = root.querySelector("[data-rc-health]");
  const statusLine = root.querySelector("[data-rc-status]");
  const sourceText = root.querySelector("[data-rc-source-text]");
  const editorForm = root.querySelector("[data-rc-editor]");
  const photoInput = root.querySelector("[data-rc-photo]");
  const photoPreview = root.querySelector("[data-rc-photo-preview]");
  const photoPlaceholder = root.querySelector("[data-rc-photo-placeholder]");
  const photoStatus = root.querySelector("[data-rc-photo-status]");
  const deletePhotoButton = root.querySelector("[data-rc-delete-photo]");

  function apiUrl(path) {
    return `${API_BASE_URL.replace(/\/$/, "")}${path}`;
  }

  function absoluteUrl(url) {
    if (!url) return "";
    if (/^https?:\/\//i.test(url)) return url;
    return apiUrl(url.startsWith("/") ? url : `/${url}`);
  }

  function requestOptions(options) {
    const next = Object.assign({ credentials: "include" }, options || {});
    next.headers = Object.assign({}, next.headers || {});
    if (ACCESS_KEY) next.headers["X-Access-Key"] = ACCESS_KEY;
    return next;
  }

  function setStatus(text) {
    statusLine.textContent = text;
  }

  function setButtonState(button, active) {
    button.style.background = active ? "#222222" : "#ffffff";
    button.style.color = active ? "#ffffff" : "#222222";
  }

  function setDisabledButton(button, disabled) {
    button.disabled = disabled;
    button.style.color = disabled ? "#999999" : "#222222";
    button.style.cursor = disabled ? "default" : "pointer";
  }

  function applyFieldStyles(label, title, input) {
    label.style.display = "block";
    label.style.padding = "10px 0";
    label.style.borderBottom = "1px solid #eeeeee";
    title.style.display = "block";
    title.style.marginBottom = "6px";
    title.style.fontWeight = "700";
    input.style.width = "100%";
    input.style.minHeight = "38px";
    input.style.resize = "vertical";
    input.style.padding = "8px";
    input.style.border = "1px solid #bbbbbb";
    input.style.borderRadius = "4px";
    input.style.font = "inherit";
    input.style.lineHeight = "1.35";
  }

  function visibleFields(fields) {
    return (fields || []).filter((field) => {
      const key = field.key || "";
      return !["email", "phone", "telephone", "mobile", "candidate_phone"].includes(key)
        && !/^job\d+_(site|url|website)$/i.test(key);
    });
  }

  function savePayload() {
    const data = collectFormData();
    for (const key of ["email", "phone", "telephone", "mobile", "candidate_phone"]) {
      delete data[key];
    }
    return data;
  }

  function rebuildForm(fields) {
    const nextFields = visibleFields(fields && fields.length ? fields : DEFAULT_FIELDS);
    fieldDefs = nextFields.length ? nextFields : visibleFields(DEFAULT_FIELDS);
    editorForm.innerHTML = "";
    for (const field of fieldDefs) {
      const label = document.createElement("label");
      label.className = "rc-field";
      const title = document.createElement("span");
      title.textContent = field.label;
      const input = document.createElement("textarea");
      input.name = field.key;
      input.rows = 2;
      applyFieldStyles(label, title, input);
      label.append(title, input);
      editorForm.appendChild(label);
    }
  }

  function collectFormData() {
    const data = {};
    for (const field of fieldDefs) {
      const input = editorForm.elements[field.key];
      data[field.key] = input ? input.value : "";
    }
    return data;
  }

  function fillForm(data) {
    for (const field of fieldDefs) {
      const input = editorForm.elements[field.key];
      if (input) input.value = data[field.key] || "";
    }
  }

  function resetPhotoBlock() {
    photoInput.value = "";
    photoPreview.hidden = true;
    photoPreview.removeAttribute("src");
    photoPlaceholder.hidden = false;
    photoStatus.textContent = "Фото не загружено";
    setDisabledButton(deletePhotoButton, true);
  }

  function showPhoto(url, filename) {
    photoPreview.src = absoluteUrl(url);
    photoPreview.hidden = false;
    photoPlaceholder.hidden = true;
    photoStatus.textContent = filename ? `Фото загружено: ${filename}` : "Фото загружено";
    setDisabledButton(deletePhotoButton, false);
  }

  function setSource(source) {
    currentSource = source;
    sourceButtons.forEach((button) => {
      const isActive = button.dataset.rcSource === currentSource;
      button.classList.toggle("rc-active", isActive);
      setButtonState(button, isActive);
    });
  }

  async function readJson(response) {
    const text = await response.text();
    if (!text) return {};
    try {
      return JSON.parse(text);
    } catch (error) {
      return { error: text };
    }
  }

  function downloadFilename(disposition) {
    const encoded = disposition.match(/filename\*=UTF-8''([^;]+)/i);
    if (encoded) return decodeURIComponent(encoded[1]);
    const plain = disposition.match(/filename="?([^";]+)"?/i);
    return plain ? plain[1] : "resume.docx";
  }

  async function uploadSelectedFile() {
    const file = fileInput.files[0];
    if (!file) return;
    setStatus("Файл загружается и распознается...");
    const formData = new FormData();
    formData.append("file", file);
    formData.append("source", currentSource);
    const response = await fetch(apiUrl("/upload"), requestOptions({ method: "POST", body: formData }));
    const result = await readJson(response);
    if (!response.ok) {
      setStatus(result.error || "Не удалось загрузить файл");
      return;
    }
    currentSession = result.session_id;
    sourceText.textContent = result.text || "";
    rebuildForm(result.fields);
    fillForm(result.data || {});
    resetPhotoBlock();
    if (result.photo && result.photo.url) {
      showPhoto(result.photo.url, result.photo.filename);
    }
    setDisabledButton(saveButton, false);
    setStatus(`Загружен файл: ${result.filename}`);
  }

  async function uploadPhoto() {
    const file = photoInput.files[0];
    if (!file) return;
    if (!currentSession) {
      photoStatus.textContent = "Сначала загрузите резюме";
      photoInput.value = "";
      return;
    }
    photoStatus.textContent = "Фото загружается...";
    const formData = new FormData();
    formData.append("session_id", currentSession);
    formData.append("photo", file);
    const response = await fetch(apiUrl("/upload-photo"), requestOptions({ method: "POST", body: formData }));
    const result = await readJson(response);
    if (!response.ok) {
      photoStatus.textContent = result.error || "Не удалось загрузить фото";
      photoInput.value = "";
      return;
    }
    showPhoto(result.url || `/photo/${currentSession}`, result.filename);
  }

  async function deletePhoto() {
    if (!currentSession) return;
    const response = await fetch(apiUrl("/delete-photo"), requestOptions({
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: currentSession }),
    }));
    const result = await readJson(response);
    if (!response.ok) {
      photoStatus.textContent = result.error || "Не удалось удалить фото";
      return;
    }
    resetPhotoBlock();
  }

  async function saveDocx() {
    if (!currentSession) return;
    setStatus("Файл сохраняется...");
    const response = await fetch(apiUrl("/save"), requestOptions({
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: currentSession, data: savePayload() }),
    }));
    const contentType = response.headers.get("Content-Type") || "";
    if (response.ok && contentType.includes("application/vnd.openxmlformats-officedocument")) {
      const blob = await response.blob();
      const disposition = response.headers.get("Content-Disposition") || "";
      const filename = downloadFilename(disposition);
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      URL.revokeObjectURL(link.href);
      link.remove();
      setStatus(`Скачано: ${filename}`);
      return;
    }
    const result = await readJson(response);
    setStatus(result.error || "Не удалось сохранить файл");
  }

  async function checkHealth() {
    setStatus("Проверяю backend...");
    const response = await fetch(apiUrl("/health"), requestOptions({ method: "GET" }));
    const result = await readJson(response);
    setStatus(response.ok && result.ok ? "Backend доступен" : "Backend недоступен");
  }

  sourceButtons.forEach((button) => {
    button.addEventListener("click", async () => {
      if (button.dataset.rcSource === currentSource) return;
      setSource(button.dataset.rcSource);
      await uploadSelectedFile();
    });
  });
  fileInput.addEventListener("change", uploadSelectedFile);
  photoInput.addEventListener("change", uploadPhoto);
  deletePhotoButton.addEventListener("click", deletePhoto);
  saveButton.addEventListener("click", saveDocx);
  healthButton.addEventListener("click", checkHealth);

  setSource(currentSource);
  setDisabledButton(saveButton, true);
  setDisabledButton(deletePhotoButton, true);
  rebuildForm(DEFAULT_FIELDS);
}());

</script>
